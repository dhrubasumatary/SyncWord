services:
  - type: web
    name: syncword-render-dhrub404
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://syncword-caption-studio.dhrub404.chatgpt.site
      - key: RUNTIME_DIR
        value: /tmp/syncword
      - key: CAPTION_FONTS_DIR
        value: /usr/share/fonts/truetype/noto
      - key: FFMPEG_PRESET
        value: veryfast
      - key: FFMPEG_CRF
        value: "20"
      - key: MAX_UPLOAD_BYTES
        value: "157286400"
      - key: MAX_QUEUED_JOBS
        value: "2"
      - key: JOB_RETENTION_HOURS
        value: "2"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "180"
      - key: DEPLOYMENT_MODE
        value: hobby
